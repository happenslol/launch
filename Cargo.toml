cargo-features = ["codegen-backend"]

[package]
name = "launch"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing = "0.1.41"
include-fs = "0.2.0"
anyhow = "1.0.100"
unicode-segmentation = "1.12.0"
walkdir = "2.5.0"
freedesktop-file-parser = "0.3.1"
nucleo-matcher = "0.3.1"
async-lock = "3.4.1"
zbus = { version = "5.12.0", default-features = false, features = ["async-io"] }

[dependencies.gpui]
git = "https://github.com/zed-industries/zed"
default-features = false
features = ["wayland"]

[build-dependencies]
include-fs = "0.2.0"

[profile.dev]
debug = 1
codegen-backend = "cranelift"

[profile.release]
strip = true
lto = true
codegen-units = 1
