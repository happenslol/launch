cargo-features = ["codegen-backend"]

[package]
name = "launch"
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = 1
codegen-backend = "cranelift"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing = "0.1.41"
include-fs = "0.2.0"
anyhow = "1.0.100"
unicode-segmentation = "1.12.0"
walkdir = "2.5.0"
freedesktop-desktop-entry = "0.8.1"
nucleo-matcher = "0.3.1"
zbus = { version = "5.12.0", default-features = false, features = ["async-io"] }
thiserror = "2.0.17"
indexmap = "2.12.0"
pipewire = "0.9.2"
pulse = { package = "libpulse-binding", version = "2.30.1" }
flume = "0.12"
async-broadcast = "0.7"
rustix = { version = "1.1.2", features = ["pipe", "fs"] }
futures = "0.3"
async-process = "2.5.0"
fork = "0.6.0"
exec = "0.3.1"
ropey = { version = "=2.0.0-beta.1", features = [
  "metric_lines_lf",
  "metric_utf16",
] }
smallvec = "1.15.1"
rusqlite = { version = "0.38.0", features = ["bundled", "fallible_uint"] }
dirs = "6.0.0"
fend-core = { git = "https://github.com/happenslol/fend", branch = "computation-detection" }
clap = { version = "4.5.53", features = ["derive"] }
freedesktop-icons = "0.4.0"
itertools = "0.14.0"
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1.20"
zvariant = "5.8.0"
deadpool = "0.13.0"
rmp-serde = "1"
wayland-client = "0.31.12"
wayland-protocols-wlr = { version = "0.3.10", features = ["client"] }
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
chrono = "0.4.43"
csscolorparser = { version = "0.8.2", default-features = false }
urlencoding = "2.1.3"
pulldown-cmark = "0.13"
niri-ipc = "=25.11.0"

# TODO: We have to pull in tokio to use rig. If rig ever lets us provide our
# own http client/async runtime, I'd like to remove tokio.
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
rig-core = { version = "0.31.0" }
buildid = "1.0.4"
tracing-appender = "0.2.4"
hex = "0.4.3"

[dependencies.gpui]
git = "https://github.com/zed-industries/zed"
default-features = false
features = ["wayland"]

[build-dependencies]
include-fs = "0.2.0"

# Cranelift has a bug where native link directives from build scripts
# are not forwarded to the linker. Override the crates in the aws-lc
# and rustls chain to use the LLVM backend.
[profile.dev.package.aws-lc-rs]
codegen-backend = "llvm"
[profile.dev.package.rustls]
codegen-backend = "llvm"
