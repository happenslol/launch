cargo-features = ["codegen-backend"]

[package]
name = "launch"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing = "0.1.41"
include-fs = "0.2.0"
anyhow = "1.0.100"
unicode-segmentation = "1.12.0"
walkdir = "2.5.0"
freedesktop-desktop-entry = "0.7.19"
nucleo-matcher = "0.3.1"
async-lock = "3.4.1"
zbus = { version = "5.12.0", default-features = false, features = ["async-io"] }
thiserror = "2.0.17"
indexmap = "2.12.0"
pipewire = "0.9.2"
pulse = { package = "libpulse-binding", version = "2.30.1" }
flume = "0.11"
async-broadcast = "0.7"
rustix = { version = "1.1.2", features = ["pipe"] }
futures = "0.3"
async-process = "2.5.0"
fork = "0.4.0"
exec = "0.3.1"
ropey = { version = "=2.0.0-beta.1", features = [
  "metric_lines_lf",
  "metric_utf16",
] }
smallvec = "1.15.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }

[dependencies.gpui]
git = "https://github.com/zed-industries/zed"
default-features = false
features = ["wayland"]

[build-dependencies]
include-fs = "0.2.0"

[profile.dev]
debug = 1
codegen-backend = "cranelift"

[profile.release]
strip = true
lto = true
codegen-units = 1
