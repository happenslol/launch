[package]
name = "greetd"
version.workspace = true
edition.workspace = true

# The binary keeps the `launch-` prefix even though the crate doesn't: a
# `bin/greetd` would collide with the real greetd in a system profile, and the
# two are meant to coexist until the switch-over is done.
[[bin]]
name = "launch-greetd"
path = "src/main.rs"

[dependencies]
greet-ipc = { workspace = true, features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
libc = "0.2"
nix = { version = "0.30", features = [
  "fs",
  "ioctl",
  "mman",
  "process",
  "signal",
  "term",
  "user",
] }
pam-client2 = { version = "0.5.5", default-features = false }
toml = "0.9"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uzers = "0.12"

# The daemon forks, so it must stay single-threaded: between fork() and
# execve() a child may only call async-signal-safe functions, and the session
# child calls initgroups(), which reads NSS. `current_thread` spawns no threads
# of its own as long as nothing calls spawn_blocking.
[dependencies.tokio]
version = "1.49.0"
default-features = false
features = ["macros", "net", "rt", "signal", "sync", "time"]
